services:
  # ── PostgreSQL + TimescaleDB + PostGIS ──────────────
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: geointellisense-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - geointellisense
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: geointellisense-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - geointellisense
    restart: unless-stopped

  # ── Rust Ingestion Service ──────────────────────────
  ingestion:
    build:
      context: ./geointellisense-ingestion
      dockerfile: Dockerfile
    container_name: geointellisense-ingestion
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "3001"
      RUST_LOG: info
      PURPLEAIR_API_KEY: ${PURPLEAIR_API_KEY:-}
      PURPLEAIR_INTERVAL_SECS: ${PURPLEAIR_INTERVAL_SECS:-120}
      BROADCAST_INTERVAL_SECS: ${BROADCAST_INTERVAL_SECS:-5}
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "${INGESTION_PORT}:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - geointellisense
    restart: unless-stopped

  # ── Python Analytics Service ────────────────────────
  analytics:
    build:
      context: ./geointellisense-analytics
      dockerfile: Dockerfile
    container_name: geointellisense-analytics
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AIRNOW_API_KEY: ${AIRNOW_API_KEY:-}
      NOAA_CDO_TOKEN: ${NOAA_CDO_TOKEN:-}
      NASA_FIRMS_KEY: ${NASA_FIRMS_KEY:-}
      EPA_AQS_EMAIL: ${EPA_AQS_EMAIL:-}
      EPA_AQS_KEY: ${EPA_AQS_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      REDIS_URL: redis://redis:6379
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "${ANALYTICS_PORT}:3002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - geointellisense
    restart: unless-stopped

  # ── Caddy API Gateway ──────────────────────────────
  gateway:
    image: caddy:2-alpine
    container_name: geointellisense-gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      ingestion:
        condition: service_healthy
      analytics:
        condition: service_healthy
    networks:
      - geointellisense
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  caddydata:
    driver: local

networks:
  geointellisense:
    driver: bridge
